<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숲지기의 아침 — The Warden Wakes</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Noto Serif KR","Nanum Myeongjo",Georgia,serif;color:#efe6d2}
  #wrap{position:relative;width:min(100vw,calc(100vh*1.85));aspect-ratio:1.85/1}
  canvas{width:100%;height:100%;display:block;background:#000}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55))}
  #ui.hide{opacity:0;pointer-events:none}
  #ui h1{margin:0;font-weight:400;letter-spacing:.35em;font-size:clamp(20px,3.2vw,46px);text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #ui h2{margin:-10px 0 0;font-weight:400;letter-spacing:.5em;font-size:clamp(10px,1vw,14px);opacity:.75}
  #play{font:inherit;font-size:clamp(13px,1.2vw,18px);letter-spacing:.2em;color:#2a2026;background:#f1e3c2;border:0;border-radius:2px;padding:12px 30px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  #play:disabled{opacity:.5;cursor:wait}
  #play:hover:not(:disabled){background:#fff3d6}
  #msg{font-size:12px;letter-spacing:.2em;opacity:.7;min-height:1em}
  #prog{width:200px;height:2px;background:rgba(255,255,255,.15);transition:opacity .6s}
  #bar{height:100%;width:0;background:#f1e3c2}
  #keys{position:absolute;bottom:14px;font-size:11px;letter-spacing:.15em;opacity:.5}
  #ui.end h2,#ui.end #keys{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="film"></canvas>
  <div id="ui">
    <h1>숲지기의 아침</h1>
    <h2>THE WARDEN WAKES</h2>
    <button id="play" disabled>배경을 그리는 중…</button>
    <div id="prog"><div id="bar"></div></div>
    <div id="msg"></div>
    <div id="keys">SPACE 일시정지 · R 처음부터 · M 음소거 · F 전체화면</div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   CORE — math, noise, colour, splines, hand-inked strokes
   ============================================================ */
const W = 1920, H = 1038, FPS = 24, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const EZ = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  out2: t => 1 - (1 - t) * (1 - t), in2: t => t * t,
  sine: t => .5 - .5 * Math.cos(Math.PI * t)
};
function RNG(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hsh(i, j = 0, k = 0) {
  let h = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul(k | 0, 1274126177);
  h = Math.imul(h ^ h >>> 13, 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function n1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hsh(i, s, 7), hsh(i + 1, s, 7), u) * 2 - 1; }
function n2(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hsh(xi, yi, s), hsh(xi + 1, yi, s), u), lerp(hsh(xi, yi + 1, s), hsh(xi + 1, yi + 1, s), u), v) * 2 - 1;
}
function fbm(x, y, s = 0, o = 4) { let v = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { v += a * n2(x * f, y * f, s + i * 17); f *= 2.03; a *= .5; } return v; }

/* ---------- colour ---------- */
const _cc = new Map();
function rgbOf(h) {
  if (typeof h !== 'string') return h;
  let r = _cc.get(h);
  if (!r) { const s = h.slice(1); r = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; _cc.set(h, r); }
  return r;
}
function css(c, a = 1) { const r = rgbOf(c); return `rgba(${r[0] | 0},${r[1] | 0},${r[2] | 0},${a})`; }
function mix(a, b, t) { const A = rgbOf(a), B = rgbOf(b); return [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]; }
function vary(c, rng, amt = 12, a = 1) {
  const r = rgbOf(c), d = (rng() - .5) * amt;
  return `rgba(${clamp(r[0] + d + (rng() - .5) * amt * .5, 0, 255) | 0},${clamp(r[1] + d + (rng() - .5) * amt * .5, 0, 255) | 0},${clamp(r[2] + d + (rng() - .5) * amt * .5, 0, 255) | 0},${a})`;
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }

/* ---------- affine ---------- */
class Mx {
  constructor(a = 1, b = 0, c = 0, d = 1, e = 0, f = 0) { this.a = a; this.b = b; this.c = c; this.d = d; this.e = e; this.f = f; }
  mul(m) { return new Mx(this.a * m.a + this.c * m.b, this.b * m.a + this.d * m.b, this.a * m.c + this.c * m.d, this.b * m.c + this.d * m.d, this.a * m.e + this.c * m.f + this.e, this.b * m.e + this.d * m.f + this.f); }
  t(x, y) { return this.mul(new Mx(1, 0, 0, 1, x, y)); }
  r(a) { const c = Math.cos(a), s = Math.sin(a); return this.mul(new Mx(c, s, -s, c, 0, 0)); }
  s(x, y = x) { return this.mul(new Mx(x, 0, 0, y, 0, 0)); }
  k(sx, sy) { return this.mul(new Mx(1, sy, sx, 1, 0, 0)); }
  p(x, y) { return [this.a * x + this.c * y + this.e, this.b * x + this.d * y + this.f]; }
  get sc() { return Math.sqrt(Math.abs(this.a * this.d - this.b * this.c)); }
}

/* ---------- splines ---------- */
// pts: [[x,y,(sharp)]...]  -> dense array
function crSpline(pts, closed, step = 4) {
  // expand sharp points by duplication
  const P = [];
  for (const p of pts) { P.push(p); if (p[2] === 1) P.push(p); }
  const n = P.length, out = [];
  if (n < 2) return P.map(p => [p[0], p[1]]);
  const get = i => closed ? P[(i + n) % n] : P[clamp(i, 0, n - 1)];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    if (len < 0.01) continue;
    const m = Math.max(1, Math.ceil(len / step));
    for (let k = 0; k < m; k++) {
      const t = k / m, t2 = t * t, t3 = t2 * t;
      out.push([
        .5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  if (!closed) out.push([P[n - 1][0], P[n - 1][1]]);
  return out;
}
function arcLen(d) { const s = [0]; for (let i = 1; i < d.length; i++) s.push(s[i - 1] + Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1])); return s; }
function signedArea(d) { let a = 0; for (let i = 0, n = d.length; i < n; i++) { const p = d[i], q = d[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }

// map + spline + hand jitter (screen space). seed changes per drawing => "boil" only when moving
function prep(m, pts, closed, seed, jit = 1, step = 3) {
  const mp = pts.map(p => { const q = m.p(p[0], p[1]); if (p[2] === 1) q.push(1); return q; });
  const d = crSpline(mp, closed, step);
  if (jit > 0 && d.length > 2) {
    const s = arcLen(d), n = d.length;
    const o = d.map((p, i) => {
      const a = d[(i - 1 + n) % n], b = d[(i + 1) % n];
      let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const off = jit * (n1(s[i] / 55 + seed * 3.17, seed) * .8 + n1(s[i] / 13 + seed, seed + 3) * .25);
      return [p[0] - ty * off, p[1] + tx * off];
    });
    return o;
  }
  return d;
}
function pathOf(d, closed = true) {
  const p = new Path2D(); if (!d.length) return p;
  p.moveTo(d[0][0], d[0][1]); for (let i = 1; i < d.length; i++) p.lineTo(d[i][0], d[i][1]);
  if (closed) p.closePath(); return p;
}

/* ---------- ink ---------- */
// variable width brush/pen line. o: {w, col, seed, closed, taper, light:[lx,ly], sw (shadow weight), var, vf}
function ink(ctx, d, o) {
  const n = d.length; if (n < 2) return;
  const closed = !!o.closed, s = arcLen(d), L = s[n - 1];
  if (L < 0.5) return;
  const orient = closed ? (signedArea(d) > 0 ? 1 : -1) : 1;
  const left = [], right = [];
  const seed = o.seed || 0, vr = o.var ?? .35, vf = o.vf || 46, tl = o.taper ?? Math.min(L * .4, 30);
  const lx = o.light ? o.light[0] : 0, ly = o.light ? o.light[1] : 0, sw = o.sw ?? .6;
  for (let i = 0; i < n; i++) {
    const a = closed ? d[(i - 1 + n) % n] : d[Math.max(0, i - 1)], b = closed ? d[(i + 1) % n] : d[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const nx = -ty, ny = tx; // left normal
    let w = o.w;
    if (!closed && tl > 0) { const e = Math.min(s[i] / tl, (L - s[i]) / tl, 1); w *= .12 + .88 * Math.pow(Math.max(e, 0), .65); }
    w *= 1 + vr * n1(s[i] / vf + seed * 5.3, seed + 11);
    if (o.light) {
      // outward normal for closed: orientation dependent
      const onx = closed ? -nx * orient : nx, ony = closed ? -ny * orient : ny;
      const dt = onx * lx + ony * ly;
      w *= 1 + sw * clamp(-dt, 0, 1) - .62 * clamp(dt - .15, 0, 1);
    }
    w = Math.max(w, .25) * .5;
    left.push([d[i][0] + nx * w, d[i][1] + ny * w]); right.push([d[i][0] - nx * w, d[i][1] - ny * w]);
  }
  ctx.beginPath();
  if (closed) {
    ctx.moveTo(left[0][0], left[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]); ctx.closePath();
    ctx.moveTo(right[n - 1][0], right[n - 1][1]); for (let i = n - 2; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]); ctx.closePath();
  } else {
    ctx.moveTo(left[0][0], left[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]); ctx.closePath();
  }
  ctx.fillStyle = o.col; ctx.fill('nonzero');
}
// shifted copy of a path (for cel shadow / rim crescents)
function shifted(path, dx, dy) { const p = new Path2D(); p.addPath(path, new DOMMatrix([1, 0, 0, 1, dx, dy])); return p; }
/* ============================================================
   PAINT — gouache brush primitives for background art
   ============================================================ */
function blobPath(ctx, x, y, r, rng, o = {}) {
  const n = o.n || clamp(((r / 3) | 0) + 6, 6, 20), ex = o.ex || 1, ang = o.ang || 0, rough = o.rough ?? .35;
  const ca = Math.cos(ang), sa = Math.sin(ang), pts = [];
  const ph = rng() * TAU;
  for (let k = 0; k < n; k++) {
    const a = ph + k / n * TAU, rr = r * (1 - rough / 2 + rough * rng());
    const px = Math.cos(a) * rr * ex, py = Math.sin(a) * rr;
    pts.push([x + px * ca - py * sa, y + px * sa + py * ca]);
  }
  ctx.beginPath();
  const m0 = [(pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2];
  ctx.moveTo(m0[0], m0[1]);
  for (let k = 0; k < n; k++) { const p = pts[k], q = pts[(k + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  ctx.closePath();
}
function dab(ctx, x, y, r, col, rng, o) { blobPath(ctx, x, y, r, rng, o); ctx.fillStyle = col; ctx.fill(); }

// tapered brush stroke with ragged sides
function bstroke(ctx, x1, y1, x2, y2, w, col, rng, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const bend = (o.bend ?? (rng() - .5) * .25) * L, segs = o.segs || 7, tp = o.taper ?? 1;
  const Lf = [], Rt = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, bx = x1 + dx * t + nx * bend * Math.sin(Math.PI * t), by = y1 + dy * t + ny * bend * Math.sin(Math.PI * t);
    let ww = w * (tp ? Math.pow(Math.sin(Math.PI * (.06 + .88 * t)), .5 * tp) : 1) * (.8 + .4 * rng()) * .5;
    if (o.headHeavy) ww *= 1.3 - .8 * t;
    Lf.push([bx + nx * ww, by + ny * ww]); Rt.push([bx - nx * ww * (.7 + .5 * rng()), by - ny * ww * (.7 + .5 * rng())]);
  }
  ctx.beginPath(); ctx.moveTo(Lf[0][0], Lf[0][1]);
  for (const p of Lf) ctx.lineTo(p[0], p[1]);
  for (let i = Rt.length - 1; i >= 0; i--) ctx.lineTo(Rt[i][0], Rt[i][1]);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
// dry-brush streaks (visible bristle texture)
function dry(ctx, x, y, len, w, ang, col, rng, k = 5) {
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 0; i < k; i++) {
    const o = (rng() - .5) * w, l0 = rng() * len * .2, l1 = len * (.6 + .4 * rng());
    bstroke(ctx, x - s * o + c * l0, y + c * o + s * l0, x - s * o + c * l1, y + c * o + s * l1, .8 + rng() * w * .12, col, rng, { segs: 4 });
  }
}
function softDot(ctx, x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, css(col, a)); g.addColorStop(.55, css(col, a * .55)); g.addColorStop(1, css(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

/* foliage clump — dark mass → lit plane → light plane → sparkle, leafy edges */
function leafyBlob(ctx, x, y, r, col, rng, leaf, vamt, arc) {
  dab(ctx, x, y, r, vary(col, rng, vamt), rng, { rough: .22, ex: 1.12 });
  const ne = Math.max(6, (r / 3.2 * leaf) | 0);
  for (let j = 0; j < ne; j++) {
    const a = arc ? arc[0] + (rng() - .5) * arc[1] : rng() * TAU, rr = r * (.9 + .12 * rng());
    dab(ctx, x + Math.cos(a) * rr * 1.1, y + Math.sin(a) * rr, r * (.09 + .1 * rng()) * Math.min(leaf, 1.4), vary(col, rng, vamt), rng, { ex: 1.8, ang: a, rough: .5, n: 6 });
  }
}
function clump(ctx, cx, cy, R, pal, rng, o = {}) {
  const lx = o.lx ?? .62, ly = o.ly ?? -.78, sq = o.sq ?? .82, leaf = o.leaf ?? 1, vamt = o.vary ?? 12;
  const la = Math.atan2(ly, lx);
  // silhouette mass
  leafyBlob(ctx, cx, cy, R * .86, pal[0], rng, leaf, vamt);
  if (R < 10) { dab(ctx, cx + lx * R * .3, cy + ly * R * .3, R * .5, vary(pal[1], rng, vamt), rng, { n: 7 }); return; }
  const N = clamp(Math.round(Math.pow(R / 10, 2) * .8 * (o.dens ?? 1)), 5, 90);
  const T = [];
  for (let i = 0; i < N; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * .82;
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    T.push({ x: cx + x * R, y: cy + y * R * sq, f: (x * lx + y * ly) + (rng() - .5) * .55, r: R * (.17 + .13 * rng()) });
  }
  T.sort((a, b) => a.y - b.y);
  for (const t of T) {
    const tone = t.f > .42 ? 2 : t.f > -.15 ? 1 : 0;
    const body = pal[tone], cap = tone === 2 ? (pal[3] ? mix(pal[2], pal[3], .3) : pal[2]) : pal[tone + 1];
    leafyBlob(ctx, t.x, t.y, t.r, body, rng, leaf * .7, vamt);
    if (tone > 0 || rng() < .5) {
      const cr = t.r * (tone === 2 ? .55 : .62);
      const cc = tone === 0 ? pal[1] : cap;
      dab(ctx, t.x + lx * t.r * .38, t.y + ly * t.r * .38, cr, vary(cc, rng, vamt), rng, { ex: 1.25, rough: .45, n: 8, ang: rng() });
      for (let j = 0; j < 3; j++) { const a = la + (rng() - .5) * 2.2, d = t.r * (.55 + .3 * rng()); dab(ctx, t.x + lx * t.r * .3 + Math.cos(a) * d, t.y + ly * t.r * .3 + Math.sin(a) * d, t.r * (.12 + .08 * rng()), vary(cc, rng, vamt), rng, { ex: 1.8, ang: a, n: 6, rough: .5 }); }
    }
    if (tone === 2 && pal[3] && rng() < (o.hi ?? .3)) { const a = la + (rng() - .5) * 1.2; dab(ctx, t.x + Math.cos(a) * t.r * .65, t.y + Math.sin(a) * t.r * .6, t.r * (.1 + .08 * rng()), vary(pal[3], rng, 8), rng, { ex: 1.8, ang: a + 1.4, n: 6 }); }
  }
}

function trunkShape(ctx, x, yb, yt, wb, wt, pal, rng, o = {}) {
  const lean = o.lean || 0, segs = 14, L = [], R = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, y = lerp(yb, yt, t), w = lerp(wb, wt, Math.pow(t, .8)) * (1 + .08 * n1(t * 5, o.seed || 3));
    const cx = x + lean * t * t * (yb - yt) + n1(t * 3, (o.seed || 3) + 5) * wb * .25;
    L.push([cx - w / 2, y]); R.push([cx + w / 2, y]);
  }
  // root flare
  L[0][0] -= wb * .35; R[0][0] += wb * .35;
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]); for (const p of L) ctx.lineTo(p[0], p[1]);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]); ctx.closePath();
  ctx.fillStyle = vary(pal[0], rng, 6); ctx.fill();
  ctx.save(); ctx.clip();
  // lit side strip
  const side = o.side ?? 1;
  for (let i = 0; i < segs; i++) {
    const a = side > 0 ? R[i] : L[i], b = side > 0 ? R[i + 1] : L[i + 1], w = (R[i][0] - L[i][0]);
    bstroke(ctx, a[0] - side * w * .18, a[1], b[0] - side * w * .18, b[1], w * .35, vary(pal[1], rng, 10), rng, { taper: 0, segs: 3 });
    if (pal[2] && rng() < .7) bstroke(ctx, a[0] - side * w * .06, a[1], b[0] - side * w * .06, b[1], w * .12, vary(pal[2], rng, 10), rng, { taper: .5, segs: 3 });
  }
  // bark streaks
  const nb = ((yb - yt) / 6) | 0;
  for (let i = 0; i < nb; i++) {
    const t = rng(), y = lerp(yb, yt, t), j = (t * segs) | 0, xl = L[j][0], xr = R[j][0];
    const xx = lerp(xl, xr, rng());
    bstroke(ctx, xx, y, xx + (rng() - .5) * 3, y - 6 - rng() * 22, 1 + rng() * 2.2, vary(rng() < .5 ? pal[0] : (pal[3] || pal[0]), rng, 14, .8), rng, { segs: 3 });

      let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9; for (const p of pts) { bx0 = Math.min(bx0, p[0]); bx1 = Math.max(bx1, p[0]); by0 = Math.min(by0, p[1]); by1 = Math.max(by1, p[1]); }
      for (let i = 0; i < 26; i++) {
        const x = lerp(bx0, bx1, rr()), y = lerp(by0, by1, rr() * .55), q = m.p(x, y), r = (5 + rr() * 9) * sc;
        ctx.fillStyle = rr() < .7 ? pal.mossL : pal.mossH; blobPath(ctx, q[0], q[1], r, rr, { ex: 1.6, rough: .5, n: 7 }); ctx.fill();
      }

        const x = lerp(bx0, bx1, rr()), y = lerp(by0, by1, .55 + rr() * .45), q = m.p(x, y), r = (4 + rr() * 7) * sc;
        ctx.fillStyle = pal.mossS; blobPath(ctx, q[0], q[1], r, rr, { ex: 1.5, rough: .5, n: 7 }); ctx.fill();
      }
    }
  });
  if (grass) for (const [x, y, l, a] of grass) {
    const p0 = [x, y + 6], p1 = [x + Math.sin(a) * l * .5, y - l * .5], p2 = [x + Math.sin(a) * l * 1.1, y - l];
    S.line(m, [p0, p1, p2], .7, RPAL.mossInk, { taper: 4 });

}

/* leafy cel clump (character-layer foliage) */
function celClump(S, m, cx, cy, R, seed) {
  const r = RNG(seed), pts = [], n = 11;

    fill: S.pal.leaf, sh: R * .55, rim: R * .12, lw: .75, inkC: '#24301f', step: 2.5,
    over: () => { const q = m.p(cx + R * .25, cy - R * .3); S.ctx.fillStyle = S.pal.leafL; blobPath(S.ctx, q[0], q[1], R * .32 * S.sc, r, { ex: 1.3, n: 8, rough: .45 }); S.ctx.fill(); }
  });
}

/* ---------- vines (verlet, simulated in root/model space) ---------- */
function makeVines(defs) {
  return defs.map(v => ({ ...v, pts: null, old: null, cut: false }));
}
function vineAnchor(F, v) { return F[v.f].p(v.p[0], v.p[1]); }
function stepVines(vines, F, dt, wind = 0, t = 0) {
  for (const v of vines) {
    const a = vineAnchor(F, v);
    if (!v.pts) { v.pts = []; v.old = []; for (let i = 0; i <= v.n; i++) { v.pts.push([a[0] + i * .5, a[1] + i * v.seg]); v.old.push([a[0] + i * .5, a[1] + i * v.seg]); } }
    if (v.cutAt != null && t >= v.cutAt) v.cut = true;
    for (let i = 0; i <= v.n; i++) {
      const p = v.pts[i], o = v.old[i];
      const vx = (p[0] - o[0]) * .965, vy = (p[1] - o[1]) * .965;
      o[0] = p[0]; o[1] = p[1];
      p[0] += vx + wind * dt * dt * (1 + i * .1) * Math.sin(t * 2 + i * .5 + v.n);
      p[1] += vy + 1400 * dt * dt;
    }
    for (let it = 0; it < 5; it++) {
      if (!v.cut) { v.pts[0][0] = a[0]; v.pts[0][1] = a[1]; }
      for (let i = 0; i < v.n; i++) {
        const p = v.pts[i], q = v.pts[i + 1], dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy) || 1, df = (d - v.seg) / d * .5;
        if (i === 0 && !v.cut) { q[0] -= dx * df * 2; q[1] -= dy * df * 2; }
        else { p[0] += dx * df; p[1] += dy * df; q[0] -= dx * df; q[1] -= dy * df; }
      }
    }
  }
}
function drawVines(S, root, vines, filter) {
  const { ctx, pal, sc, lw } = S;
  for (const v of vines) {
    if (!v.pts || (filter && !filter(v))) continue;
    const pts = v.pts.map(p => root.p(p[0], p[1]));
    const seed = (v.id || 1) * 13;
    const d = crSpline(pts, false, 3);
    ink(ctx, d, { w: lw * 1.7 * (v.w || 1), col: '#2c3a26', seed, taper: 10, var: .3 });
    if (sc < .12) continue;
    for (let i = 1; i <= v.n; i++) {
      if ((i + (v.id | 0)) % 2) continue;
      const p = pts[i], q = pts[i - 1], ang = Math.atan2(p[1] - q[1], p[0] - q[0]) + ((i >> 1) % 2 ? 1.1 : -1.1);
      const L = (v.leaf || 20) * sc * (.7 + .5 * hsh(i, v.id | 0));
      const tip = [p[0] + Math.cos(ang) * L, p[1] + Math.sin(ang) * L], nx = -Math.sin(ang) * L * .32, ny = Math.cos(ang) * L * .32;
      const mid = [(p[0] + tip[0]) / 2, (p[1] + tip[1]) / 2];
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(mid[0] + nx, mid[1] + ny, tip[0], tip[1]); ctx.quadraticCurveTo(mid[0] - nx, mid[1] - ny, p[0], p[1]);
      ctx.fillStyle = pal.leaf; ctx.fill();
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(mid[0] - nx, mid[1] - ny, tip[0], tip[1]); ctx.lineTo(p[0], p[1]); ctx.fillStyle = 'rgba(40,60,70,.35)'; ctx.fill();
      if (L > 6) { ctx.lineWidth = Math.max(.6, lw * .35); ctx.strokeStyle = '#24301f'; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(mid[0] + nx, mid[1] + ny, tip[0], tip[1]); ctx.quadraticCurveTo(mid[0] - nx, mid[1] - ny, p[0], p[1]); ctx.stroke(); }
    }
  }
}

/* ---------- pose → frames (model space; root = ground point) ---------- */
function robotFrames(P) {
  const I = new Mx();
  const pel = I.t(P.x || 0, -P.pel);
  const T = pel.r(P.tilt || 0).s(1 + (P.sq || 0), 1 - (P.sq || 0));
  const hu = P.hu || 0;
  const Hd = T.t(P.hx || 0, -476 + (P.hdy || 0) - hu * 6).r(P.hrot || 0);
  const SR = T.t(252, -404 + (P.shR || 0)), SL = T.t(-252, -404 + (P.shL || 0)).s(-1, 1);
  const AR = T.t(234, -376 + (P.aRdy || 0)).r(-(P.aR ?? .05));
  const AL = T.t(-234, -376 + (P.aLdy || 0)).s(-1, 1).r(-(P.aL ?? .05));
  return { I, pel, T, Hd, SR, SL, AR, AL };
}

/* ---------- main draw ---------- */

  /* sapling on left pauldron (bends with sway) */

/* additive bloom for glowing parts, drawn on the final frame */
function glowBloom(ctx, x, y, r, a, col = RPAL.glow) {

}
/* ============================================================
   BACKGROUNDS — painted once at load (gouache simulation)
   ============================================================ */
const BG = {};
const PAL = {
  farF: ['#6c8197', '#7c90a2', '#a2adb4', '#d9cbb6'],
  midF: ['#2b4350', '#3c5a5d', '#5d7b6d', '#b4b496'],
  midW: ['#2e4a46', '#4b6c58', '#87a06a', '#e2cf8a'],
  fg: ['#1d2e2c', '#2b4339', '#43603f', '#8e9a5a'],
  fgGold: ['#22322c', '#344c3a', '#5d7845', '#e6c27a'],
  grass: ['#4f6a46', '#6a8452', '#8fa25c', '#c8c07a'],
};
function ridge(ctx, w, y0, amp, freq, seed, col, h, o = {}) {
  ctx.beginPath(); ctx.moveTo(0, h);
  const pts = [];
  for (let x = 0; x <= w; x += 6) { const y = y0 + amp * fbm(x * freq, 0, seed, 5) + (o.slope || 0) * x; pts.push([x, y]); ctx.lineTo(x, y); }
  ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  return pts;
}
function canopyBand(ctx, w, yTop, h, pal, rng, o = {}) {
  // continuous canopy edge made of crowns, filled below
  const rmin = o.rmin || 14, rmax = o.rmax || 30;
  const yAt = x => yTop + (o.amp || 20) * fbm(x * (o.freq || .004), 3, o.seed || 1, 3) + (o.dip ? o.dip(x) : 0);
  ctx.fillStyle = pal[0];
  ctx.beginPath(); ctx.moveTo(0, h); for (let x = 0; x <= w; x += 8) ctx.lineTo(x, yAt(x) + rmax * .6); ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  const rows = o.rows || 3;
  for (let r = 0; r < rows; r++) {
    let x = -rmax;
    while (x < w + rmax) {
      const R = lerp(rmin, rmax, rng()) * (1 + r * .15);
      clump(ctx, x, yAt(x) + r * rmax * .9 + R * .3, R, pal, rng, { k: 2 + (rng() * 3 | 0), leaf: o.leaf ?? .8, vary: o.vary ?? 10, lx: o.lx, ly: o.ly });
      x += R * (1.1 + rng() * .6);
    }
  }
  return yAt;
}
function meadow(ctx, x0, y0, w, h, rng, pal, o = {}) {
  // ground plane with brushwork, receding
  const g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, css(pal[1])); g.addColorStop(1, css(pal[0]));
  ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
  const n = o.n || 2600;
  for (let i = 0; i < n; i++) {
    const t = Math.pow(rng(), .8), y = y0 + t * h, x = x0 + rng() * w, s = .4 + t * 1.6;
    const lit = o.lit ? o.lit(x, y) : .3;
    const c = rng() < lit ? (rng() < .25 ? pal[3] : pal[2]) : (rng() < .5 ? pal[1] : pal[0]);
    bstroke(ctx, x, y, x + (rng() - .5) * 4 * s, y - (4 + rng() * 10) * s, (1.4 + rng() * 2) * s, vary(c, rng, 14, .85), rng, { segs: 3 });
  }
}

   AUDIO — synthesized score and foley (WebAudio, scheduled)
   ============================================================ */
const AU = { C: null, bus: null, rev: null, start: 0, noise: null, ok: false };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function audioInit() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  const C = new AC(); AU.C = C;
  const comp = C.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(C.destination);
  AU.master = C.createGain(); AU.master.gain.value = .9; AU.master.connect(comp);
  // reverb impulse
  const len = C.sampleRate * 3.6, ib = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ib.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  AU.rev = C.createConvolver(); AU.rev.buffer = ib; const rg = C.createGain(); rg.gain.value = .55; AU.rev.connect(rg); rg.connect(AU.master);
  const nb = C.createBuffer(1, C.sampleRate * 4, C.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; AU.noise = nb;
  const bb = C.createBuffer(1, C.sampleRate * 4, C.sampleRate), bd = bb.getChannelData(0); let last = 0; for (let i = 0; i < bd.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; } AU.brown = bb;
  AU.ok = true; return true;
}
function newBus() { if (AU.bus) { try { AU.bus.disconnect(); AU.busR.disconnect(); } catch (e) { } } AU.bus = AU.C.createGain(); AU.bus.connect(AU.master); AU.busR = AU.C.createGain(); AU.busR.connect(AU.rev); }
function env(g, t, a, peak, hold, rel, base = .0001) { g.gain.setValueAtTime(base, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(base, t + a + hold + rel); }
function out(node, dry = 1, wet = .3, pan = 0) {
  const C = AU.C; let n = node;
  if (pan && C.createStereoPanner) { const p = C.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
  if (dry) { const g = C.createGain(); g.gain.value = dry; n.connect(g); g.connect(AU.bus); }
  if (wet) { const g = C.createGain(); g.gain.value = wet; n.connect(g); g.connect(AU.busR); }
}
function osc(type, f, t0, t1) { const o = AU.C.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.start(t0); o.stop(t1 + .05); return o; }
function noiseSrc(t0, t1, brown) { const s = AU.C.createBufferSource(); s.buffer = brown ? AU.brown : AU.noise; s.loop = true; s.start(t0, Math.random() * 3); s.stop(t1 + .05); return s; }
function filt(type, f, q = 1) { const b = AU.C.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

/* instruments */
function piano(t, m, dur = 2.5, v = .12, pan = 0) {
  const C = AU.C, f = mtof(m), g = C.createGain(), lp = filt('lowpass', 2600 + m * 10, .5);
  for (const [mul, a, ty] of [[1, 1, 'sine'], [2, .35, 'sine'], [3, .1, 'triangle'], [4.02, .04, 'sine']]) { const o = osc(ty, f * mul, t, t + dur); const og = C.createGain(); og.gain.value = a; o.connect(og); og.connect(g); }
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(v * .35, t + .4); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  g.connect(lp); out(lp, .8, .45, pan);
}
function pad(t0, t1, notes, v = .05, cut = 900, cutEnd) {
  const C = AU.C, g = C.createGain(), lp = filt('lowpass', cut, .7);
  if (cutEnd) lp.frequency.linearRampToValueAtTime(cutEnd, t1);
  for (const m of notes) for (const d of [-6, 5]) { const o = osc('sawtooth', mtof(m), t0, t1 + 2.5); o.detune.value = d; const og = C.createGain(); og.gain.value = .5; o.connect(og); og.connect(g); }
  g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 1.6); g.gain.setValueAtTime(v, t1); g.gain.linearRampToValueAtTime(.0001, t1 + 2.4);
  g.connect(lp); out(lp, .7, .5);
}
function chirp(t, f0, f1, d, v = .03, pan = 0) {
  const C = AU.C, o = osc('sine', f0, t, t + d), g = C.createGain();
  o.frequency.exponentialRampToValueAtTime(f1, t + d * .6); o.frequency.exponentialRampToValueAtTime(f0 * .9, t + d);
  env(g, t, .005, v, d * .3, d * .6); o.connect(g); out(g, .6, .4, pan);

function birdSong(t, v = .025, pan = 0) { const r = Math.random; let tt = t; const n = 2 + (r() * 4 | 0), base = 2600 + r() * 1800; for (let i = 0; i < n; i++) { chirp(tt, base * (1 + r() * .2), base * (1.3 + r() * .4), .05 + r() * .07, v, pan); tt += .08 + r() * .07; } }
function flutter(t, d, v = .05, pan = 0, rate = 15) {
  const C = AU.C, n = noiseSrc(t, t + d), bp = filt('bandpass', 1300, .8), g = C.createGain();
  g.gain.setValueAtTime(0, t); for (let k = 0; k < d * rate; k++) { const tk = t + k / rate; g.gain.setValueAtTime(v * (1 - k / (d * rate) * .5), tk); g.gain.setValueAtTime(v * .1, tk + .5 / rate); }
  g.gain.setValueAtTime(0, t + d); n.connect(bp); bp.connect(g); out(g, .8, .2, pan);
}
function rumble(t, d, v = .3, a = 1) {
  const C = AU.C, n = noiseSrc(t, t + d, true), lp = filt('lowpass', 140, .7), g = C.createGain();
  env(g, t, a, v, d - a - 1.2, 1.2); n.connect(lp); lp.connect(g); out(g, 1, .15);
  const s = osc('sine', 34, t, t + d), sg = C.createGain(); env(sg, t, a, v * .5, d - a - 1.2, 1.2); s.connect(sg); out(sg, 1, 0);
}
function boom(t, v = .9, f0 = 110, f1 = 26, d = 2.2) {
  const C = AU.C, s = osc('sine', f0, t, t + d), g = C.createGain(); s.frequency.exponentialRampToValueAtTime(f1, t + d * .8);
  env(g, t, .01, v, .1, d); s.connect(g); out(g, 1, .25);
  const n = noiseSrc(t, t + d), lp = filt('lowpass', 900, .5), ng = C.createGain(); lp.frequency.exponentialRampToValueAtTime(120, t + d); env(ng, t, .005, v * .6, .05, d * .8); n.connect(lp); lp.connect(ng); out(ng, 1, .5);
}
function whoosh(t, d, v = .25, f0 = 300, f1 = 2400, pan = 0) {
  const C = AU.C, n = noiseSrc(t, t + d), bp = filt('bandpass', f0, 1.2), g = C.createGain();
  bp.frequency.exponentialRampToValueAtTime(f1, t + d * .35); bp.frequency.exponentialRampToValueAtTime(f0 * .8, t + d);
  env(g, t, d * .3, v, 0, d * .7); n.connect(bp); bp.connect(g); out(g, .9, .5, pan);
}
function zap(t, d = .07, v = .08) {
  const C = AU.C, o = osc('square', 98, t, t + d), g = C.createGain(), bp = filt('bandpass', 1800, 2);
  env(g, t, .002, v, d * .6, d * .4); o.connect(bp); bp.connect(g); out(g, .8, .4);
  const n = noiseSrc(t, t + d), ng = C.createGain(), hp = filt('highpass', 2500); env(ng, t, .001, v * .8, d * .3, d * .5); n.connect(hp); hp.connect(ng); out(ng, .6, .3);
}
function hum(t0, t1, v = .05) {
  const C = AU.C, g = C.createGain();
  for (const [f, a] of [[110, 1], [220, .4], [331, .15]]) { const o = osc('sine', f, t0, t1); o.frequency.linearRampToValueAtTime(f * 1.06, t1); const og = C.createGain(); og.gain.value = a; o.connect(og); og.connect(g); }
  g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 1.2); g.gain.setValueAtTime(v, t1 - 1); g.gain.linearRampToValueAtTime(.0001, t1); out(g, .8, .5);
}
function tink(t, f = 2400, v = .06, pan = 0) { const C = AU.C; for (const [m, a] of [[1, 1], [2.76, .4], [5.4, .15]]) { const o = osc('sine', f * m, t, t + 2), g = C.createGain(); env(g, t, .002, v * a, 0, 1.8); o.connect(g); out(g, .6, .7, pan); } }
function creak(t, d, v = .12, f = 900) {
  // stick-slip friction: irregular impulse train through a resonant filter
  const C = AU.C, sr = C.sampleRate, len = Math.ceil(d * sr), b = C.createBuffer(1, len, sr), dd = b.getChannelData(0);
  let pos = 0, rate = 40;
  while (pos < len) { rate = clamp(rate + (Math.random() - .5) * 18, 18, 120); const amp = .5 + Math.random() * .5; for (let k = 0; k < 40 && pos + k < len; k++) dd[pos + k] += amp * Math.exp(-k / 6) * (k % 2 ? -1 : 1); pos += Math.floor(sr / rate); }
  const s = C.createBufferSource(); s.buffer = b; s.start(t);
  const bp = filt('bandpass', f, 9), bp2 = filt('bandpass', f * 2.3, 6), g = C.createGain();

function groan(t, d, v = .22) {
  const C = AU.C, g = C.createGain(), lp = filt('lowpass', 520, 2), bp = filt('bandpass', 240, 3);
  for (const [f, a] of [[44, 1], [66.5, .5], [88.3, .35]]) {
    const o = osc('sawtooth', f, t, t + d); const steps = 30, cur = new Float32Array(steps); let w = 1;
    for (let i = 0; i < steps; i++) { w = clamp(w + (Math.random() - .5) * .06, .85, 1.08); cur[i] = f * w * (1 - i / steps * .12); }
    o.frequency.setValueCurveAtTime(cur, t, d); const og = C.createGain(); og.gain.value = a; o.connect(og); og.connect(g);
  }
  env(g, t, .8, v, d - 2, 1.2); g.connect(lp); g.connect(bp); const mg = C.createGain(); mg.gain.value = .8; lp.connect(mg); bp.connect(mg); out(mg, 1, .45);

function rattle(t, d, v = .05) { for (let i = 0; i < d * 14; i++) { const tt = t + Math.random() * d, C = AU.C, n = noiseSrc(tt, tt + .05), bp = filt('bandpass', 800 + Math.random() * 2500, 3), g = C.createGain(); env(g, tt, .001, v * Math.random(), .005, .04); n.connect(bp); bp.connect(g); out(g, .7, .3, (Math.random() - .5)); } }
function roar(t, d, v = .4) {
  const C = AU.C, n = noiseSrc(t, t + d, true), n2 = noiseSrc(t, t + d), lp = filt('lowpass', 1800, .6), lp2 = filt('lowpass', 4000, .5), g = C.createGain(), g2 = C.createGain();

  env(g, t, .05, v, .4, d - .45); env(g2, t, .02, v * .25, .2, d * .5); n.connect(lp); lp.connect(g); n2.connect(lp2); lp2.connect(g2); out(g, 1, .4); out(g2, .8, .5);
}

function scheduleAll(T) {
  newBus();
  const r = Math.random;
  // forest bed
  { const C = AU.C, n = noiseSrc(T, T + 55, true), lp = filt('lowpass', 700, .5), g = C.createGain(); g.gain.setValueAtTime(.0001, T); g.gain.linearRampToValueAtTime(.12, T + 3); g.gain.setValueAtTime(.12, T + 38); g.gain.linearRampToValueAtTime(.05, T + 44); g.gain.linearRampToValueAtTime(.0001, T + 55); n.connect(lp); lp.connect(g); out(g, 1, .2); }
  for (let i = 0; i < 16; i++) birdSong(T + 1 + r() * 18, .012 + r() * .015, (r() - .5) * 1.4);
  for (let i = 0; i < 6; i++) birdSong(T + 46 + r() * 7, .012, (r() - .5) * 1.4);
  // score — gentle, Hisaishi-like piano over strings
  pad(T + .2, T + 7.2, [47, 54, 61, 62], .03, 700);            // Bm(add9)
  [[1.2, 78], [2.4, 76], [3.0, 74], [4.3, 69], [5.6, 71], [6.4, 73]].forEach(([d, m]) => piano(T + d, m, 3.2, .09));
  pad(T + 7.0, T + 13.8, [43, 50, 59, 66], .03, 800);          // Gmaj7
  [[8.0, 74], [8.9, 76], [9.6, 78], [10.4, 81], [11.5, 86], [11.7, 90], [12.6, 83]].forEach(([d, m]) => piano(T + d, m, 3, d > 11 ? .05 : .09, d > 11 ? .4 : 0));
  pad(T + 13.6, T + 19.5, [40, 47, 55, 62], .025, 600);        // Em
  [[14.2, 71], [16.4, 74], [17.4, 79]].forEach(([d, m]) => piano(T + d, m, 3.5, .06));
  // awakening foley
  flutter(T + 10.6, .9, .05, .5); tink(T + 11.52, 3800, .015, .4); birdSong(T + 12.4, .03, .4);
  for (const d of [14.6, 14.81, 15.06, 15.18]) zap(T + d);
  hum(T + 15.18, T + 21, .045);
  tink(T + 17.35, 1800, .05, -.2); tink(T + 17.85, 2150, .045, .2);
  for (let i = 0; i < 4; i++) tink(T + 18.1 + i * .08, 3800, .012);
  // tremor
  rumble(T + 19.1, 6.2, .32, .6); rattle(T + 19.3, 2, .05); flutter(T + 19.86, .7, .07, .6);
  for (let i = 0; i < 14; i++) flutter(T + 21.3 + r() * 1.1, .5 + r() * .5, .03 + r() * .03, (r() - .5) * 1.6, 13 + r() * 6);
  for (let i = 0; i < 8; i++) birdSong(T + 21.3 + r() * 1.4, .03, (r() - .5) * 1.6);
  { const C = AU.C, o = osc('sine', 36.7, T + 19.6, T + 33), g = C.createGain(); g.gain.setValueAtTime(.0001, T + 19.6); g.gain.linearRampToValueAtTime(.12, T + 22); g.gain.linearRampToValueAtTime(.16, T + 30); g.gain.linearRampToValueAtTime(.0001, T + 33); o.connect(g); out(g, 1, .1); }
  for (const d of [21.0, 22.4, 23.6]) boom(T + d, .35, 70, 40, 1.4);
  // the rise
  pad(T + 24.8, T + 28.2, [35, 47, 54, 59], .04, 500, 1400);
  pad(T + 28.0, T + 31.0, [31, 43, 50, 59], .05, 700, 1900);
  pad(T + 30.8, T + 34.0, [33, 45, 52, 61], .055, 900, 2400);
  groan(T + 25.3, 6.2, .26); creak(T + 26.0, 2.0, .12, 950); creak(T + 27.6, 1.4, .1, 1300); creak(T + 28.5, 1.8, .13, 760); creak(T + 29.6, 1.0, .1, 1100);
  rattle(T + 26, 5, .06); boom(T + 25.4, .35, 80, 40, 1.2); boom(T + 30.2, .7, 90, 30, 1.8); rumble(T + 25.4, 6, .22, .4);
  zap(T + 28.7, .03, .03); whoosh(T + 28.7, .6, .05, 1500, 3000);
  creak(T + 34.3, .7, .11, 1200);
  // look up — eyes flare
  pad(T + 34.0, T + 38.6, [38, 50, 57, 62, 66], .06, 1200, 2600);   // D major
  tink(T + 34.65, 1568, .07); tink(T + 34.7, 2349, .05); whoosh(T + 34.5, 1.2, .08, 800, 3000);
  [[36.6, 86], [36.9, 85], [37.2, 81], [37.6, 78]].forEach(([d, m]) => piano(T + d, m, 3, .06, .3));
  // ignition
  { const C = AU.C, o = osc('sawtooth', 120, T + 38.6, T + 39.4), g = C.createGain(), lp = filt('lowpass', 900); o.frequency.exponentialRampToValueAtTime(900, T + 39.3); env(g, T + 38.6, .6, .05, .05, .15); o.connect(lp); lp.connect(g); out(g, .9, .4); }
  boom(T + 39.3, 1.0, 120, 24, 2.6); whoosh(T + 39.3, 2.4, .32, 200, 1800); roar(T + 39.3, 2.4, .2);
  roar(T + 41.4, 6.4, .42); boom(T + 41.6, .9, 140, 26, 2.2); whoosh(T + 41.5, 1.4, .3, 400, 4000);
  // flight — full theme
  const th = [[43.8, [38, 50, 57, 62, 66]], [46.0, [37, 49, 57, 64, 69]], [48.2, [35, 47, 54, 62, 66]], [50.4, [31, 43, 50, 59, 62]]];
  th.forEach(([d, notes], i) => pad(T + d, T + d + 2.3 + (i === 3 ? 2.2 : 0), notes, .065, 1400, 2800));
  [[43.9, 74], [44.3, 78], [44.7, 81], [45.1, 86], [46.0, 85], [46.5, 81], [47.0, 76], [47.35, 93], [48.2, 83], [48.7, 78], [49.2, 74], [50.4, 79], [50.9, 83], [51.4, 86], [52.4, 90]].forEach(([d, m]) => piano(T + d, m, 3.4, d === 47.35 ? .05 : .085, (m - 80) / 20));
  tink(T + 47.35, 3136, .06, .3);
  for (let i = 0; i < 10; i++) { const tt = T + 45 + r() * 9; flutter(tt, .4, .012, (r() - .5), 6); }
}
/* ============================================================
   MAIN — film surface, playback, UI
   ============================================================ */
const cv = document.getElementById('film'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
let GRAIN = [], VIG = null;
function buildPost() {
  for (let k = 0; k < 4; k++) { const g = mk(256, 256), x = g.getContext('2d'), id = x.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GRAIN.push(ctx.createPattern(g, 'repeat')); }
  VIG = mk(W, H); const v = VIG.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(30,20,40,0)'); g.addColorStop(1, 'rgba(30,20,40,.42)'); v.fillStyle = g; v.fillRect(0, 0, W, H);
}
function renderFrame(t) {
  const f = Math.floor(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // gate weave (sub-pixel, per frame)
  const wx = (hsh(f, 91) - .5) * .7, wy = (hsh(f, 92) - .5) * .7;
  ctx.setTransform(1.004, 0, 0, 1.004, -W * .002 + wx, -H * .002 + wy);
  let shot = SHOTS[SHOTS.length - 1];
  for (const s of SHOTS) if (t >= s[0] && t < s[1]) { shot = s; break; }
  shot[2](ctx, Math.min(t, DURATION - .001));
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // film surface
  ctx.drawImage(VIG, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .1; ctx.fillStyle = GRAIN[f % 4];
  ctx.translate((hsh(f, 3) * 256) | 0, (hsh(f, 4) * 256) | 0); ctx.fillRect(-256, -256, W + 256, H + 256); ctx.restore();
  // fades
  const fin = 1 - sstep(0, 1.8, t), fout = sstep(DURATION - 2.2, DURATION, t);
  const a = Math.max(fin, fout); if (a > 0) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- playback ---------- */
const ui = document.getElementById('ui'), btn = document.getElementById('play'), msg = document.getElementById('msg'), bar = document.getElementById('bar');
let playing = false, paused = false, lastF = -1, t0perf = 0, pauseAt = 0, muted = false;
function now() { if (AU.ok) return AU.C.currentTime - AU.start; return (performance.now() - t0perf) / 1000; }
function loop() {
  if (!playing) return;
  const t = now();
  if (t >= DURATION) { renderFrame(DURATION - .001); playing = false; showEnd(); return; }
  const f = Math.floor(t * FPS);
  if (f !== lastF) { renderFrame(t); lastF = f; }
  requestAnimationFrame(loop);
}
function play() {
  ui.classList.add('hide');
  if (!AU.C) audioInit();
  if (AU.ok) { AU.C.resume(); AU.start = AU.C.currentTime + .15; scheduleAll(AU.start); AU.master.gain.value = muted ? 0 : .9; }
  t0perf = performance.now() + 150;
  playing = true; paused = false; lastF = -1; requestAnimationFrame(loop);
}
function showEnd() { msg.textContent = ''; btn.textContent = '↻  다시 보기'; ui.classList.remove('hide'); ui.classList.add('end'); }
btn.addEventListener('click', play);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && playing) { e.preventDefault(); if (AU.ok) { paused ? AU.C.resume() : AU.C.suspend(); } paused = !paused; if (!paused && !AU.ok) t0perf = performance.now() - pauseAt * 1000; else pauseAt = now(); }
  if (e.key === 'r' || e.key === 'R') { play(); }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; if (AU.ok) AU.master.gain.value = muted ? 0 : .9; }
  if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); }
});

/* ---------- boot: paint the backgrounds ---------- */
(async () => {
  const steps = 20; let done = 0;
  const tick = () => new Promise(r => { done++; bar.style.width = Math.min(100, done / steps * 100) + '%'; setTimeout(r, 0); });
  buildPost();
  await buildS1(tick); await buildS2(tick); await buildS5(tick); await buildS6b(tick); await buildS7(tick); await buildS8(tick);
